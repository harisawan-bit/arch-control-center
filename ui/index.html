              </div>
              <div>
                <div class="setting-row"><div class="setting-label">Critical Battery Alert (%)</div><div class="setting-controls"><input type="number" id="sb_crl" class="input" style="width:75px" value="${sb.criticalLevel}" /><label class="switch"><input type="checkbox" id="sb_co" ${sb.criticalOn ? 'checked' : ''} /><span class="slider"></span></label></div></div>
                <div class="setting-row"><div class="setting-label">Show Percentage in Top Bar</div><label class="switch"><input type="checkbox" id="sb_sp" ${sb.showPercentage ? 'checked' : ''} /><span class="slider"></span></label></div>
                <div class="setting-row"><div class="setting-label">Desktop Notifications & Alert Volume (%)</div><div class="setting-controls"><input type="number" id="sb_vol" class="input" style="width:75px" value="${sb.volume}" /><label class="switch"><input type="checkbox" id="sb_nt" ${sb.notify ? 'checked' : ''} /><span class="slider"></span></label></div></div>
              </div>
            </div>
          </div>
        `;
      }

      // =====================================================================
      // 11. SYSTEM OPTIMIZATION, PURGE & BENCHMARKS
      // =====================================================================
      if (cat === "optimize") {
        const mem = STATE.system?.memory || {};
        const usedPct = Math.round(((mem.used || 0) / (mem.total || 1)) * 100);
        const swapPct = Math.round(((mem.swapUsed || 0) / (mem.swapTotal || 1)) * 100);
        if (tab === "storage") {
          return `
            <div class="card">
              <div class="card-header">
                <div class="card-title"><i class="fa-solid fa-hard-drive"></i> Block Devices, Btrfs & Disk Speedtest</div>
                <button class="btn btn-primary" onclick="apiAction('disk.speedtest')"><i class="fa-solid fa-gauge-high"></i> Run NVMe Disk Speedtest</button>
              </div>
              <pre class="mono" style="font-size:11.5px;color:var(--fg-dim)">${JSON.stringify(STATE.system?.disks || [], null, 2)}</pre>
            </div>
          `;
        }
        return `
          <div class="card">
            <div class="card-header">
              <div>
                <div class="card-title"><i class="fa-solid fa-fire-flame-curved"></i> Hardware Memory, Cache, Swap & ZRAM Purge Engine</div>
                <div class="card-desc">CPU: ${STATE.system?.cpu?.model || ''} · Kernel ${STATE.system?.cpu?.kernel || ''} · Load: ${(STATE.system?.cpu?.loadavg || []).join(' / ')}</div>
              </div>
              <button class="btn btn-primary" onclick="apiAction('optimize.purge', {target:'all'})"><i class="fa-solid fa-broom"></i> 1-Click Master System Purge</button>
            </div>
            <div class="grid-2" style="margin-bottom:14px">
              <div class="expand-box">
                <div style="display:flex;justify-content:space-between"><span>Physical RAM Used</span><span class="mono">${fmtBytes(mem.used)} / ${fmtBytes(mem.total)} (${usedPct}%)</span></div>
                <div class="progress-track"><div class="progress-fill" style="width:${usedPct}%"></div></div>
                <div class="setting-sub mono" style="margin-top:6px">PageCache/Buffers: ${fmtBytes(mem.cached)} · Available: ${fmtBytes(mem.available)}</div>
              </div>
              <div class="expand-box">
                <div style="display:flex;justify-content:space-between"><span>Swap & Compressed ZRAM</span><span class="mono">${fmtBytes(mem.swapUsed)} / ${fmtBytes(mem.swapTotal)} (${swapPct}%)</span></div>
                <div class="progress-track"><div class="progress-fill" style="width:${swapPct}%"></div></div>
                <div class="setting-sub mono" style="margin-top:6px">Pacman Package Cache: ${fmtBytes(STATE.system?.omarchy?.pacmanCacheBytes || 0)}</div>
              </div>
            </div>
            <div class="setting-row">
              <div class="setting-info"><div class="setting-label">Purge RAM PageCache, Dentries & Inodes</div><div class="setting-sub mono">sync && echo 3 > /proc/sys/vm/drop_caches</div></div>
              <button class="btn btn-primary" onclick="apiAction('optimize.purge', {target:'ram'})">Purge RAM Cache</button>
            </div>
            <div class="setting-row">
              <div class="setting-info"><div class="setting-label">Compact Physical Memory Zones (Defragment HugePages)</div><div class="setting-sub mono">echo 1 > /proc/sys/vm/compact_memory</div></div>
              <button class="btn" onclick="apiAction('optimize.purge', {target:'compact'})">Compact RAM</button>
            </div>
            <div class="setting-row">
              <div class="setting-info"><div class="setting-label">Flush Swap & Decompress ZRAM back to Fast RAM</div><div class="setting-sub mono">swapoff -a && swapon -a</div></div>
              <button class="btn" onclick="apiAction('optimize.purge', {target:'swap'})">Flush Swap & ZRAM</button>
            </div>
            <div class="setting-row">
              <div class="setting-info"><div class="setting-label">Vacuum Systemd Journal Logs & Prune Pacman Cache</div><div class="setting-sub mono">journalctl --vacuum-time=2d && omarchy-update-pkg-prune</div></div>
              <div class="setting-controls">
                <button class="btn" onclick="apiAction('optimize.purge', {target:'journal'})">Vacuum Journal</button>
                <button class="btn" onclick="apiAction('optimize.purge', {target:'pacman'})">Prune Pacman Cache</button>
              </div>
            </div>
          </div>
        `;
      }

      // =====================================================================
      // 12. CYBER SECURITY, LUKS2, UPDATES & SUBSYSTEM RESTARTS
      // =====================================================================
      const sec = STATE.system?.security || {};
      const om = STATE.system?.omarchy || {};
      const dt = STATE.system?.datetime || {};
      if (tab === "updates") {
        return `
          <div class="card">
            <div class="card-header"><div class="card-title"><i class="fa-solid fa-arrows-rotate"></i> Omarchy Release Channel, Timezone & Subsystem Restarts</div></div>
            <div class="setting-row">
              <div class="setting-info"><div class="setting-label">Omarchy OS Version & Release Channel</div><div class="setting-sub mono">Version: ${om.version} · Active Channel: ${om.channel}</div></div>
              <div class="setting-controls">
                ${["stable", "rc", "edge", "dev"].map(c => `
                  <button class="btn btn-sm ${om.channel === c ? 'btn-primary' : ''}" onclick="apiAction('channel.set', {channel:'${c}'})">${c}</button>
                `).join("")}
              </div>
            </div>
            <div class="setting-row">
              <div class="setting-info"><div class="setting-label">System Timezone & NTP Synchronization</div><div class="setting-sub mono">${dt.localTime} · Timezone: ${dt.timezone}</div></div>
              <span class="pill ${dt.ntp ? 'pill-ok' : 'pill-warn'}">NTP: ${dt.ntp ? 'Synchronized' : 'Off'}</span>
            </div>
            <div class="setting-row">
              <div class="setting-info"><div class="setting-label">1-Click Subsystem Restarts (omarchy-restart-*)</div><div class="setting-sub">Restart individual daemons without logging out</div></div>
              <div class="setting-controls">
                ${["shell", "wifi", "bluetooth", "audio", "hyprctl", "hyprsunset", "trackpad", "walker"].map(s => `
                  <button class="btn btn-sm" onclick="apiAction('restart.service', {service:'${s}'})"><i class="fa-solid fa-rotate"></i> ${s}</button>
                `).join("")}
              </div>
            </div>
          </div>
        `;
      }
      return `
        <div class="card">
          <div class="card-header"><div class="card-title"><i class="fa-solid fa-user-shield"></i> Cyber Security, LUKS2 Disk Encryption & Authentication</div></div>
          <div class="setting-row">
            <div class="setting-info"><div class="setting-label">LUKS2 Full-Disk Volume Encryption</div><div class="setting-sub">Root Btrfs container encrypted via dm-crypt / cryptsetup</div></div>
            <span class="pill ${sec.luksActive ? 'pill-ok' : 'pill-warn'}">${sec.luksActive ? 'LUKS2 Active & Locked' : 'Unencrypted'}</span>
          </div>
          <div class="setting-row">
            <div class="setting-info"><div class="setting-label">Netfilter / UFW Firewall Status</div><div class="setting-sub">Host packet filtering & hotspot NAT isolation</div></div>
            <span class="pill ${sec.ufwActive ? 'pill-ok' : 'pill-neutral'}">${sec.ufwActive ? 'UFW Active' : 'Netfilter / iptables Active'}</span>
          </div>
          <div class="setting-row">
            <div class="setting-info"><div class="setting-label">OpenSSH Server Daemon (sshd)</div><div class="setting-sub">Inbound remote shell access status</div></div>
            <span class="pill ${sec.sshd ? 'pill-warn' : 'pill-ok'}">${sec.sshd ? 'SSHD Running' : 'SSHD Disabled (Safe)'}</span>
          </div>
          <div class="setting-row">
            <div class="setting-info"><div class="setting-label">Biometric Fingerprint Sensor (fprintd)</div><div class="setting-sub">PAM authentication for sudo & lock screen</div></div>
            <span class="pill ${sec.fingerprint ? 'pill-ok' : 'pill-neutral'}">${sec.fingerprint ? 'Installed' : 'Not Installed'}</span>
          </div>
          <div class="setting-row">
            <div class="setting-info">
              <div class="setting-label">Howdy Facial Recognition Authentication (/usr/bin/howdy)</div>
              <div class="setting-sub">IR camera face unlock for lock screen, sudo & PAM</div>
            </div>
            <div class="setting-controls">
              <span class="pill ${sec.howdy?.installed ? 'pill-ok' : 'pill-warn'}">${sec.howdy?.installed ? 'Installed & Configured' : 'Not Found'}</span>
              ${sec.howdy?.installed ? `<button class="btn btn-sm btn-primary" onclick="apiAction('howdy.test')"><i class="fa-solid fa-camera"></i> Test Facial Match</button>` : ''}
            </div>
          </div>
        </div>
      `;
    }

    refreshState();
  </script>
</body>
</html>
